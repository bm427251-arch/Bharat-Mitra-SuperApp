name: Build Flutter Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter dependencies
        run: flutter pub get

      - name: 🔧 Ensure Gradle Wrapper and Permissions
        run: |
          chmod +x android/gradlew
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Pre-downloading gradle-wrapper.jar..."
            curl -sSL -o "android/gradle/wrapper/gradle-wrapper.jar" "https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar" || \
            curl -sSL -o "android/gradle/wrapper/gradle-wrapper.jar" "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" || true
          fi

      - name: 🛠️ Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: 📤 Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bharat-mitra-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
